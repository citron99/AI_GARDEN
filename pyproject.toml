[project]
name = "ai-garden"
version = "0.1.0"
description = "AI-помощник садовода: диагностика растений по фото, каталог, уход, биллинг"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle (базовый набор ruff по умолчанию)
    "F",               # pyflakes
    "I",               # isort
    "B",               # flake8-bugbear
    "BLE",             # blind except
    "DTZ011",          # наивный date.today()
    "SIM",             # упрощения
    "S",               # bandit
    "UP",              # pyupgrade
    "PLR0402",         # ручной from-import
    "RUF043",          # pytest.raises с неэкранированным паттерном
    "RUF100",          # неиспользуемый noqa
]
ignore = [
    # Проект намеренно использует кириллицу и типографские символы в строках/комментариях
    "RUF001",
    "RUF002",
    "RUF003",
    # API намеренно преобразует внутренние исключения в HTTPException без цепочки
    "B904",
]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() и другие вызовы FastAPI в default-аргументах — штатный паттерн фреймворка
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Тесты: assert и тестовые секреты допустимы
"tests/**" = ["S101", "S105", "S106", "S107"]
# Сравнения date.today() с колонками типа Date (без времени) — корректны
"app/routers/partner_*.py" = ["DTZ011"]
"app/services/**" = ["DTZ011"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
# Рэтчет: эти два кода отключены глобально, потому что в данной схеме они дают в основном
# ложные срабатывания — Session.get()/db.scalar() объявлены как Optional, хотя FK с
# ON DELETE CASCADE гарантирует строку (union-attr), а строки, уже провалидированные pydantic,
# mypy не может сопоставить с Literal-полями сторонних SDK (arg-type).
disable_error_code = ["union-attr", "arg-type"]

[[tool.mypy.overrides]]
# pydantic-settings читает обязательные поля из окружения/.env, поэтому Settings() без аргументов корректен
module = "app.config"
disable_error_code = ["union-attr", "arg-type", "call-arg"]

[[tool.mypy.overrides]]
# Стабы Pillow не экспортируют псевдоним Image.BICUBIC; openai SDK не выводит точную форму input для Responses API
module = ["app.services.demo_seed", "app.ai.providers.openai_multimodal"]
disable_error_code = ["union-attr", "arg-type", "attr-defined", "assignment", "misc", "list-item"]

[tool.pytest.ini_options]
timeout = 90
timeout_method = "thread"
